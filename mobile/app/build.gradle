// Module build file for the pure native Android client.
// No cross-platform framework is used - only the Android SDK, the Google Maps
// SDK and the ZXing library for generating and scanning the transaction QR code.
plugins {
    id 'com.android.application'
}

// Read the Google Maps key from local.properties, which is kept out of git.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

android {
    namespace 'com.sliit.smartsolar'
    compileSdk 35

    defaultConfig {
        applicationId "com.sliit.smartsolar"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // Base URL of the C# Web API.
        // For physical device over USB (with adb reverse): http://127.0.0.1:5205
        // For Android Emulator: http://10.0.2.2:5205
        // Override in local.properties via API_BASE_URL=http://...
        def apiBaseUrl = localProperties.getProperty("API_BASE_URL", "http://127.0.0.1:5205")
        buildConfigField "String", "API_BASE_URL", "\"$apiBaseUrl\""

        // Supply your key in local.properties as MAPS_API_KEY=xxxx
        manifestPlaceholders = [MAPS_API_KEY: localProperties.getProperty("MAPS_API_KEY", "")]
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Google Maps - used to plot nearby microgrid nodes.
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // ZXing - transaction QR code generation (prosumer) and scanning (operator).
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}
