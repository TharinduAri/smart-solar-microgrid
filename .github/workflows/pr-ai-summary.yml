name: Gemini AI PR Summary

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-summary:
    name: Generate Summary with Google Gemini
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract sanitized Git diff
        run: |
          echo "Fetching target base branch: origin/${{ github.base_ref }}"
          git fetch origin ${{ github.base_ref }}

          echo "Generating filtered diff against origin/${{ github.base_ref }}..."
          git diff origin/${{ github.base_ref }}...HEAD \
            ':!package-lock.json' \
            ':!*.lock' \
            ':!*.svg' \
            ':!*.png' \
            ':!*.ico' \
            ':!dist/**' \
            ':!bin/**' \
            ':!obj/**' > diff.txt

          echo "Diff generated. Size in bytes: $(wc -c < diff.txt)"

      - name: Generate PR title and summary with Google Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          python3 .github/scripts/generate_pr_summary.py diff.txt pr_summary.md pr_title.txt

      - name: Publish title and summary to Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          AI_TITLE=$(cat pr_title.txt 2>/dev/null || echo "")
          EXISTING_BODY=$(gh pr view "$PR_NUMBER" --json body -q .body 2>/dev/null || echo "")

          # Update PR title if generated by Gemini
          if [ -n "$AI_TITLE" ]; then
            echo "Updating PR title to: $AI_TITLE"
            gh pr edit "$PR_NUMBER" --title "$AI_TITLE"
          fi

          # Update PR description if empty, or post summary as comment
          if [ -z "$EXISTING_BODY" ] || [ "$EXISTING_BODY" = "null" ]; then
            echo "PR body is empty. Setting PR description..."
            gh pr edit "$PR_NUMBER" --body-file pr_summary.md
          else
            echo "PR body already contains content. Adding AI summary as a comment..."
            gh pr comment "$PR_NUMBER" --body-file pr_summary.md
          fi
